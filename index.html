<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Espelho Produção MZ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f2f2f0;--card:#fff;--tx:#111;--mu:#6b6b6b;--ln:#e6e6e3;--in:#f3f3f1;--y:#ffc400;--r:#e10600;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141414;--card:#1e1e1e;--tx:#f2f2f2;--mu:#9a9a9a;--ln:#2e2e2e;--in:#2a2a2a}}
:root[data-theme=dark]{--bg:#141414;--card:#1e1e1e;--tx:#f2f2f2;--mu:#9a9a9a;--ln:#2e2e2e;--in:#2a2a2a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px Inter,system-ui,sans-serif}
h1,h2,.hd{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--ln);background:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px}
.btn.y{background:var(--y);border-color:var(--y);color:#111}.btn:hover{filter:brightness(.96)}
.hide{display:none!important}
header{background:var(--card);padding:14px 28px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--ln)}
header h1{font-size:30px;margin:0;line-height:1}header small{color:var(--mu)}
.sp{flex:1}.pill{border:1px solid var(--ln);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;background:var(--in)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#1db954;margin-right:6px}.dot.off{background:#999}
.clk{text-align:right}.clk b{font:700 20px "Barlow Condensed",sans-serif;display:block}.clk span{font-size:12px;color:var(--mu)}
main{padding:20px 28px}
.top{display:flex;justify-content:space-between;align-items:baseline}.top h2{font-size:26px;margin:0 0 10px}.top span{color:var(--mu);font-size:12px}
.flt{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.flt label{display:flex;flex-direction:column;gap:4px;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--mu);text-transform:uppercase}
.flt input,.flt select,.f input,.f select,.f textarea{background:var(--in);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;min-width:150px}
.flt .q{flex:1;min-width:220px}.flt .q input{width:100%}
.tw{margin-top:16px;background:var(--card);border:1px solid var(--ln);border-radius:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1100px}
th{background:#000;color:#fff;font-size:11px;letter-spacing:.06em;text-align:left;padding:14px 12px;text-transform:uppercase;white-space:nowrap}
th:first-child{border-top-left-radius:10px}td{padding:11px 12px;border-bottom:1px solid var(--ln);white-space:nowrap}
td.d{white-space:normal;min-width:300px;font-weight:600}td.n{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:var(--in)}
.st{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px}
.s1{background:#e3f6e8;color:#157a33}.s2{background:#fff3cc;color:#8a6200}.s3{background:#ececec;color:#555}
.ic{border:1px solid var(--ln);background:var(--card);border-radius:8px;width:32px;height:32px;cursor:pointer;margin-right:4px}
.ro .ac{display:none}.tg{position:relative;width:64px;height:32px;border-radius:20px;border:1px solid var(--ln);background:var(--in);cursor:pointer;padding:0;flex:none}
.tg i{position:absolute;top:7px;color:var(--mu);display:flex;font-style:normal}
.tg span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;transition:transform .25s}
.tg em{display:none;font-style:normal}.tg .s{color:#e8a200}.tg .m{color:#7b8cff}
:root[data-theme=light] .tg .s,:root[data-theme=dark] .tg .m{display:flex}
:root[data-theme=dark] .tg span{transform:translateX(32px)}
.bar{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--r);border-radius:10px;padding:10px 14px}
.nadm .sc{display:none}td.sc,th.sc{width:36px;text-align:center}input[type=checkbox]{width:16px;height:16px;accent-color:var(--r);cursor:pointer}
tr.dayend td{background:transparent!important;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);text-align:center;font:500 11px Inter,sans-serif;letter-spacing:.02em;color:var(--mu);padding:5px 12px}
.emp{padding:40px;text-align:center;color:var(--mu)}
footer{margin-top:30px;background:#000;padding:18px;text-align:center}footer img{height:92px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.md{background:var(--card);border-radius:14px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.md .h{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--ln)}.md .h h2{margin:0;font-size:24px}
.f{padding:20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:16px}.f label{display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.f .w{grid-column:1/-1}.f input,.f select,.f textarea{width:100%;min-width:0}.f i{color:var(--r)}
.md .b{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--ln)}
#login{min-height:100vh;background:#000;display:flex;align-items:center;justify-content:center;padding:20px}
.lc{background:var(--card);border-radius:16px;padding:28px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.lc img{width:170px;align-self:center;background:#000;border-radius:10px}.lc h2{margin:0;font-size:26px;text-align:center}
.lc label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;display:flex;flex-direction:column;gap:6px}
.lc input{background:var(--in);border:1px solid var(--ln);border-radius:8px;padding:11px}
.er{color:var(--r);font-size:12px;min-height:16px}.lk{background:none;border:0;color:var(--mu);text-decoration:underline;cursor:pointer;font-size:12px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:10px;z-index:99;font-size:13px}
</style></head><body>

function setMode(m){mode=m;const L=m==="login",R=m==="reset";$("#lt").textContent=R?"Redefinir senha":m==="new"?"Primeiro acesso":"Espelho Produção MZ";
$("#pw").parentElement.classList.toggle("hide",R);$("#pl").textContent=m==="new"?"Crie uma senha (6 números)":"Senha (6 dígitos)";
$("#lb").textContent=L?"Entrar":R?"Enviar link de redefinição":"Criar senha";$("#lm").textContent=L?"Esqueci minha senha":"Voltar ao login";$("#lf").classList.toggle("hide",!L);$("#er").textContent=""}
$("#lm").onclick=()=>setMode(mode==="login"?"reset":"login");$("#lf").onclick=()=>setMode("new");
const isAdm=()=>ADMINS.includes(me),canEd=()=>role==="admin"||role==="edit";
const access=async e=>{if(ADMINS.includes(e))return"admin";const d=await db.doc("acessos/"+e).get();return d.exists?d.data().role:null};
function applyRole(){const a=isAdm(),w=canEd();$("#imp").classList.toggle("hide",!a);$("#usr").classList.toggle("hide",!a);$("#nw").classList.toggle("hide",!w);document.body.classList.toggle("ro",!w);document.body.classList.toggle("nadm",!a)}
function renderUsers(){$("#ul").innerHTML=ADMINS.map(a=>`<tr><td>${esc(a)}</td><td><b>Administrador</b></td><td></td></tr>`).join("")+[...acc].sort((a,b)=>a.email.localeCompare(b.email)).map(u=>`<tr><td>${esc(u.email)}</td><td><select data-r="${esc(u.email)}"><option value="view"${u.role==="view"?" selected":""}>Visualizar</option><option value="edit"${u.role==="edit"?" selected":""}>Editar</option></select></td><td><button class="ic" data-d="${esc(u.email)}">✕</button></td></tr>`).join("")}
$("#usr").onclick=()=>$("#ov2").classList.remove("hide");$("#x2").onclick=()=>$("#ov2").classList.add("hide");
$("#ua").onclick=async()=>{const e=$("#un").value.trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return toast("Informe um e-mail válido");try{await db.doc("acessos/"+e).set({email:e,role:$("#ur").value});$("#un").value="";toast("Acesso liberado")}catch(x){toast("Sem permissão para alterar acessos")}};
$("#ul").onchange=async ev=>{const l=ev.target.closest("select");if(!l)return;try{await db.doc("acessos/"+l.dataset.r).set({email:l.dataset.r,role:l.value})}catch(x){toast("Erro ao salvar")}};
$("#ul").onclick=async ev=>{const b=ev.target.closest("button");if(b&&confirm("Remover o acesso de "+b.dataset.d+"?"))try{await db.doc("acessos/"+b.dataset.d).delete()}catch(x){toast("Erro ao remover")}};
const err=m=>$("#er").textContent=m;
$("#lb").onclick=async()=>{const e=$("#em").value.trim().toLowerCase(),p=$("#pw").value;
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return err("Informe um e-mail válido");
 try{if(mode==="reset"){await auth.sendPasswordResetEmail(e);return err("Se o e-mail estiver cadastrado, enviamos o link de redefinição.")}
  if(!/^\d{6}$/.test(p))return err("A senha deve ter exatamente 6 números");
  if(mode==="new"){const c=await auth.createUserWithEmailAndPassword(e,p);await c.user.sendEmailVerification();await auth.signOut();setMode("login");return err("Enviamos um e-mail de confirmação. Clique no link e depois entre.")}
  await auth.signInWithEmailAndPassword(e,p)}catch(x){err(x.code==="auth/email-already-in-use"?"Este e-mail já tem senha. Use o login ou “Esqueci minha senha”.":"E-mail ou senha incorretos")}};
$("#pw").onkeydown=e=>{if(e.key==="Enter")$("#lb").click()};
function start(e){me=e;err("");$("#login").classList.add("hide");$("#app").classList.remove("hide");$("#who").textContent=e;
 unsubA&&unsubA();unsubA=db.doc("acessos/"+e).onSnapshot(d=>{role=ADMINS.includes(e)?"admin":(d.exists?d.data().role:null);if(!role){toast("Seu acesso foi removido");return $("#out").click()}applyRole();render()},()=>{});
 if(ADMINS.includes(e)){unsubU&&unsubU();unsubU=db.collection("acessos").onSnapshot(q=>{acc=q.docs.map(d=>d.data());renderUsers()},()=>{})}
 unsub&&unsub();unsub=db.collection("ops").onSnapshot(s=>{ops=s.docs.map(d=>({id:d.id,...d.data()}));$("#dot").className="dot";render()},()=>$("#dot").className="dot off")}
$("#out").onclick=ev=>{ev.preventDefault();auth.signOut()};
function tick(){const d=new Date();$("#ck").textContent=d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});$("#dt").textContent=d.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"})}
tick();setInterval(tick,1000);
const F=["q","fs","fu","fp","fe"];F.forEach(i=>$("#"+i).oninput=render);
$("#clr").onclick=()=>{F.forEach(i=>$("#"+i).value="");render()};
function render(){const q=norm($("#q").value),fs=$("#fs").value,fu=$("#fu").value,fp=$("#fp").value,fe=$("#fe").value,adm=isAdm();
 const l=ops.filter(o=>(!q||norm([o.op,o.cod,o.desc,o.status,o.obs].join(" ")).includes(q))&&(!fs||o.status===fs)&&(!fu||o.um===fu)&&(!fp||o.dp===fp)&&(!fe||o.de===fe))
 .sort((a,b)=>(a.dp||"9999").localeCompare(b.dp||"9999")||String(a.op).localeCompare(String(b.op),"pt",{numeric:true}));
 $("#cnt").textContent=l.length+" de "+ops.length+" registros";vis=l.map(o=>o.id);const cn={};l.forEach(o=>cn[o.dp||""]=(cn[o.dp||""]||0)+1);for(const k of [...sel])if(!ops.some(o=>o.id===k))sel.delete(k);queueMicrotask(updBar);
 $("#tb").innerHTML=l.length?l.map((o,k)=>{const i=Math.max(0,ST.indexOf(o.status)),nx=l[k+1];const r=`<tr><td class="sc"><input type="checkbox" data-s="${esc(o.id)}"${sel.has(o.id)?" checked":""}></td><td><b>${fd(o.dp)}</b></td><td><b>${fd(o.de)}</b></td><td>${esc(o.op)}</td><td>${esc(o.cod)}</td><td class="d">${esc(o.desc)}</td><td><b>${esc(o.um)}</b></td><td class="n"><b>${fn(o.qp)}</b></td><td class="n">${fn(o.qe)}</td><td><span class="st ${SC[i]}">${esc(o.status)}</span></td><td>${esc(o.obs)}</td><td class="ac"><button class="ic" title="Editar" data-e="${esc(o.id)}">✎</button>${adm?`<button class="ic" title="Excluir" data-x="${esc(o.id)}">🗑</button>`:""}</td></tr>`;return(nx&&(nx.dp||"")===(o.dp||""))?r:r+endRow(o.dp,cn[o.dp||""])}).join(""):`<tr><td colspan="12" class="emp">Nenhuma ordem encontrada. ${isAdm()?"Use “Importar planilha” para carregar as OPs.":""}</td></tr>`}
$("#tb").onclick=async e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.e)openM(ops.find(o=>o.id===b.dataset.e));
 if(b.dataset.x&&confirm("Excluir esta OP?"))try{await db.doc("ops/"+b.dataset.x).delete()}catch(x){toast("Sem permissão para excluir")}};
const endRow=(dp,n)=>{let t="Fim das ordens sem data planejada";if(dp){const[y,m,d]=dp.split("-");t="Fim do dia "+d+"/"+MES[m-1]+" · "+new Date(y,m-1,d).toLocaleDateString("pt-BR",{weekday:"long"})}return`<tr class="dayend"><td colspan="12">${t} · ${n} ${n===1?"ordem":"ordens"}</td></tr>`};
function updBar(){const n=sel.size,a=isAdm();$("#bar").classList.toggle("hide",!a||!n);$("#bn").textContent=n+(n===1?" OP selecionada":" OPs selecionadas");const c=$("#ca");if(c){const k=vis.filter(i=>sel.has(i)).length;c.checked=vis.length>0&&k===vis.length;c.indeterminate=k>0&&k<vis.length}}
$("#tb").onchange=e=>{const c=e.target.closest("input[data-s]");if(!c)return;c.checked?sel.add(c.dataset.s):sel.delete(c.dataset.s);updBar()};
$("#ca").onchange=e=>{vis.forEach(i=>e.target.checked?sel.add(i):sel.delete(i));render()};
$("#bc").onclick=()=>{sel.clear();render()};
$("#bd").onclick=async()=>{const ids=[...sel];if(!ids.length||!confirm("Excluir "+ids.length+" OP(s) selecionada(s)? Esta ação não pode ser desfeita."))return;
 try{for(let i=0;i<ids.length;i+=400){const b=db.batch();ids.slice(i,i+400).forEach(id=>b.delete(db.collection("ops").doc(id)));await b.commit()}sel.clear();toast(ids.length+" OP(s) excluída(s)")}catch(x){toast("Erro ao excluir: "+(x.message||x.code))}};
const M={eo:"op",ec:"cod",ed:"desc",eu:"um",es:"status",ep:"qp",ef:"qe",e1:"dp",e2:"de",eb:"obs"};
function openM(o){editId=o?o.id:null;$("#mt").textContent=o?"Editar OP":"Nova OP";
 for(const k in M)$("#"+k).value=o?(o[M[k]]??""):(k==="es"?ST[2]:k==="eu"?"L":"");$("#eo").disabled=!!o;$("#ov").classList.remove("hide")}
$("#nw").onclick=()=>openM(null);const cl=()=>$("#ov").classList.add("hide");$("#mx").onclick=$("#mc").onclick=cl;
$("#ms").onclick=async()=>{const o={};for(const k in M){const v=$("#"+k).value;o[M[k]]=k==="ep"||k==="ef"?(v===""?"":Number(v)):v.trim()}
 if(!o.op||!o.cod||!o.desc||o.qp==="")return toast("Preencha os campos obrigatórios (*)");
 try{await db.doc("ops/"+(editId||opid(o.op))).set(o);cl();toast("Salvo")}catch(x){toast("Erro ao salvar: "+(x.message||x.code))}};
$("#imp").onclick=()=>$("#fi").click();
const iso=v=>{if(v==null||v==="")return"";if(v instanceof Date)return new Date(v.getTime()-v.getTimezoneOffset()*6e4).toISOString().slice(0,10);
 const s=String(v).trim(),y=new Date().getFullYear();let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
 if(m)return(m[3].length==2?"20"+m[3]:m[3])+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
 m=s.match(/^(\d{1,2})\/([a-zç]{3})/i);if(m){const i=MES.indexOf(m[2].toLowerCase());if(i>=0)return y+"-"+String(i+1).padStart(2,"0")+"-"+m[1].padStart(2,"0")}
 return/^\d{4}-\d\d-\d\d/.test(s)?s.slice(0,10):""};
const num=v=>{if(typeof v==="number")return v;const s=String(v??"").trim();if(!s)return"";return Number(s.replace(/\./g,"").replace(",","."))||0};
const mapSt=s=>{s=norm(s);return s.includes("finaliz")?ST[0]:(s.includes("produ")||s.includes("envase")||s.includes("andamento"))?ST[1]:ST[2]};
$("#fi").onchange=async ev=>{const f=ev.target.files[0];if(!f)return;
 try{const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true}),r=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""});
  const hi=r.findIndex(x=>x.some(c=>norm(c).includes("op")&&/n/.test(norm(c)))&&x.some(c=>norm(c).includes("descri")));if(hi<0)throw new Error("Cabeçalho não encontrado");
  const H=r[hi].map(norm),c=k=>H.findIndex(h=>h.includes(k)),ix={dp:c("data plan"),de:c("data efet"),op:H.findIndex(h=>/op/.test(h)&&h.length<8),cod:c("cod"),desc:c("descri"),um:H.findIndex(h=>h==="um."||h==="um"),qp:c("qty plan"),qe:c("qty efet"),st:c("status"),obs:c("observ")};
  const ex=Object.fromEntries(ops.map(o=>[o.id,o]));let n=0,jobs=[];
  for(const x of r.slice(hi+1)){if(!x[ix.op])continue;const id=opid(x[ix.op]),old=ex[id];
   const o={op:String(x[ix.op]).trim(),dp:iso(x[ix.dp]),de:iso(x[ix.de]),cod:String(x[ix.cod]).trim(),desc:String(x[ix.desc]).trim(),um:String(x[ix.um]).trim(),qp:num(x[ix.qp]),qe:num(x[ix.qe]),
    status:old?old.status:mapSt(x[ix.st]),obs:old?old.obs||"":String(x[ix.obs]||"")};
   jobs.push(db.doc("ops/"+id).set(o));n++;if(jobs.length>=10){await Promise.all(jobs);jobs=[]}}
  await Promise.all(jobs);toast(n+" OPs importadas (status já editados foram preservados)")
 }catch(x){toast("Falha ao importar: "+(x.message||x.code))}ev.target.value=""};
</script></body></html>
